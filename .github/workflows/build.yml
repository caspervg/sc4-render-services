name: Windows CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.0.2"

      - name: Configure (Debug)
        run: cmake --preset vs2022-win32-debug -DSC4RS_BUILD_SAMPLES=ON

      - name: Build (Debug, all DLLs)
        run: cmake --build --preset vs2022-win32-debug-all

  validate-tag:
    name: Validate Release Tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH[-PRERELEASE], for example v0.6.0 or v0.6.0-rc.1. Got: $TAG_NAME"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate-tag
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.0.2"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Configure (Release)
        run: cmake --preset vs2022-win32-release -DSC4RS_BUILD_SAMPLES=ON "-DSC4RS_RELEASE_VERSION=${{ github.ref_name }}"

      - name: Build (Release, all DLLs)
        run: cmake --build --preset vs2022-win32-release-all

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: SC4RenderServices.spdx.json
          upload-artifact: false

      - name: Build Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rootDir = $env:GITHUB_WORKSPACE
          $outDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $buildDir = Join-Path $rootDir "cmake-build-release-visual-studio/Release"
          $refName = "${{ github.ref_name }}"
          $version = if ($refName -match '^v(.+)') { $Matches[1] } else { "${{ github.sha }}".Substring(0, 7) }
          $installerPath = Join-Path $outDir ("SC4RenderServices-" + $version + "-Setup.exe")
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building installer for version: $version"
          Set-Location (Join-Path $rootDir "dist")
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DAPP_VERSION=$version `
            /DINSTALLER_OUTPUT=..\artifacts\$(Split-Path -Leaf $installerPath) `
            /DRENDER_SERVICES_DLL_PATH=..\cmake-build-release-visual-studio\Release\SC4RenderServices.dll `
            /DRENDER_SERVICES_INI_PATH=..\SC4RenderServices.ini `
            SC4RenderServicesInstaller.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
          Write-Host "Installer contents:"
          Get-ChildItem -Path ..\artifacts -Filter "*.exe" | Select-Object Name, Length

      - name: Package Release Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rootDir = $env:GITHUB_WORKSPACE
          $outDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $installerPath = Join-Path $outDir ("SC4RenderServices-" + $env:RELEASE_VERSION + "-Setup.exe")
          Copy-Item -Path (Join-Path $rootDir "dist\README.txt") -Destination (Join-Path $outDir "README.txt") -Force
          Copy-Item -Path (Join-Path $rootDir "LICENSE.txt") -Destination (Join-Path $outDir "LICENSE.txt") -Force
          Copy-Item -Path (Join-Path $rootDir "dist\THIRD_PARTY_NOTICES.txt") -Destination (Join-Path $outDir "THIRD_PARTY_NOTICES.txt") -Force
          Copy-Item -Path (Join-Path $rootDir "SC4RenderServices.spdx.json") -Destination (Join-Path $outDir "SC4RenderServices.spdx.json") -Force

          $paths = @(
            $installerPath,
            (Join-Path $outDir "README.txt"),
            (Join-Path $outDir "LICENSE.txt"),
            (Join-Path $outDir "THIRD_PARTY_NOTICES.txt"),
            (Join-Path $outDir "SC4RenderServices.spdx.json")
          )
          $archive = Join-Path $outDir ("sc4-render-services-" + $env:RELEASE_VERSION + "-win32-release.zip")
          Compress-Archive -Path $paths -DestinationPath $archive -Force

      # Build provenance: proves that this workflow built these files from this commit. Check a download
      # with `gh attestation verify <file> --repo ${{ github.repository }}`.
      - name: Attest Release Artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*-Setup.exe
            cmake-build-release-visual-studio/Release/SC4RenderServices.dll
            artifacts/SC4RenderServices.spdx.json

      # Links the SBOM to the DLL, the installer and the zip.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*-Setup.exe
            cmake-build-release-visual-studio/Release/SC4RenderServices.dll
          sbom-path: artifacts/SC4RenderServices.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            artifacts/*.zip
            artifacts/SC4RenderServices.spdx.json
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The action publishes prereleases before uploading assets, which immutable releases reject.
          # Keep them as drafts and publish below once the assets are in.
          draft: ${{ contains(github.ref_name, '-') }}

      - name: Publish prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

  # Points the sc4pac package at the new release on a branch of caspervg/simtropolis-channel, and
  # links to a prefilled pull request in the job summary.
  sc4pac:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: sc4pac
    concurrency: sc4pac-caspervg-sc4-render-services
    steps:
      - uses: caspervg/sc4pac-release-action@af95bc5692cab0a3b32e50aac5b82eb8249ffca9 # v1.0.0
        with:
          channel: sebamarynissen/simtropolis-channel
          asset-id: caspervg-sc4-render-services
          token: ${{ secrets.SC4PAC_FORK_TOKEN }}
