name: Windows CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5
        with:
          cmakeVersion: "4.0.2"

      - name: Configure (Debug)
        run: cmake --preset vs2022-win32-debug -DSC4RS_BUILD_SAMPLES=ON

      - name: Build (Debug, all DLLs)
        run: cmake --build --preset vs2022-win32-debug-all
