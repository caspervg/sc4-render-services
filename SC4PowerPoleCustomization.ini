[SC4PowerPoleCustomization]
; Lets power-pole prop exemplars declare custom cable attach points per connection direction via
; the kPropAttachPointsDir0..3 Float32Array properties, instead of being limited to the engine's
; two baked 4-point tables. Props that don't define any of those properties are unaffected.
Enabled=true

; Upper bound on attach points per direction a single exemplar property may declare.
; Vanilla's hardcoded arity is 4; raise this to allow denser cable bundles.
MaxPointsPerDirection=8
