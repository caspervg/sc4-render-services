[SC4PowerPoleCustomization]
; Lets power-pole prop exemplars declare custom cable attachment geometry and wire appearance.
; Properties are documented in docs/power-pole-customization.md. Props that define none of those
; properties remain on the unmodified vanilla rendering path.
Enabled=true

; Upper bound on attachment points and per-wire overrides accepted from one property.
; Vanilla has four wires; raise this to allow denser bundles. Valid range: 1-15.
MaxPointsPerDirection=8

; Optional named pole styles. REG.* keys describe the connected undirected headings:
; X = x axis, Z = z axis, DP = positive diagonal (+x,+z), DN = negative diagonal (+x,-z).
; Join multiple headings with + in canonical X,DP,Z,DN order. REG.None is the empty/default mask.
; Values are pole prop exemplar Instance IDs (Type 0x6534284A, Group matching vanilla's power-pole
; group unless your poles use a different one). A section can be sparse; missing combinations fall
; back to the vanilla instance for that mask. The complete key set is documented in
; docs/far-power-lines-design.md.
;
; FAR-<ratio>.<orient> keys route fractional-angle (FAR) drags to purpose-built angled pole models.
; Ratio is one of 1.5, 2, 3, 6 (slope 1:n, i.e. arctan(1/n) = 33.7/26.6/18.4/9.5 degrees). A FAR
; span is undirected, so each ratio has exactly four headings: XP/XN = 1:n tilted off the x axis
; with the minor step in +z / -z; ZP/ZN = the mirrored n:1 pair off the z axis with the minor step
; in +x / -x. Values are pole prop exemplar Instance IDs, same as REG.* keys. A FAR heading with no
; key falls back to the style's diagonal REG.* entry, then vanilla -- so cables still align even
; without dedicated art, just on the 45-degree mesh. Keys the game supports:
;   FAR-1.5.XP  FAR-1.5.XN  FAR-1.5.ZP  FAR-1.5.ZN
;   FAR-2.XP    FAR-2.XN    FAR-2.ZP    FAR-2.ZN
;   FAR-3.XP    FAR-3.XN    FAR-3.ZP    FAR-3.ZN
;   FAR-6.XP    FAR-6.XN    FAR-6.ZP    FAR-6.ZN
; A quarter-turn pairs perpendicular headings, so XP/ZN may share one model and XN/ZP a second --
; two logical models per ratio; the four keys may alias two instance IDs. An optional
; [PowerPoles.FAR] section (never a cyclable style) supplies FAR headings as a style-independent
; default, consulted after the active style and before the diagonal REG.* fallback.
;
; A style may also set InterPoleDistance = the max number of cells between poles while that style is
; active (vanilla is 10; range 1-50). Larger = poles farther apart / fewer poles. It applies only
; while the style is active and is restored to vanilla otherwise. A style may set only
; InterPoleDistance (no REG.* keys) to change spacing without changing pole models.
;
; Switching styles in-game: with the power-line tool active, Tab cycles forward through vanilla +
; every style below and Shift+Tab cycles backward (applies to newly-placed poles only, not existing
; ones). An optional on-screen overlay (requires SC4RenderServices) shows the active style, spacing,
; and live drag heading. FAR routing is independent of the active style: hold Shift while dragging
; to force a regular (non-FAR) heading.
;
;[PowerPoles.Steel]
;REG.None=0x05000205
;REG.X=0x05000205
;REG.DP=0x05000405
;REG.X+Z=0x05000105
;FAR-2.XP=0x05000505
;FAR-2.ZN=0x05000505
;FAR-2.XN=0x05000605
;FAR-2.ZP=0x05000605
;InterPoleDistance=14
;...
;
;[PowerPoles.Wood]
;REG.None=0x06000205
;REG.X+Z=0x06000105
;InterPoleDistance=7
;...
;
; Style-independent FAR fallback (optional):
;[PowerPoles.FAR]
;FAR-3.XP=0x07000505
;FAR-3.ZN=0x07000505
;
; ---------------------------------------------------------------------------
; WORKING EXAMPLE -- FA-2 (26.6 degree) poles using the P3 wood tangent meshes.
; Requires two things in your Plugins folder:
;   1. assets/power-pole-customization/SC4PowerPoleFA2Example.dat (ships with this mod; two pole
;      prop exemplars, instances 0xB07EFA20/0xB07EFA21, pointing at the P3 26.6-degree tangent
;      S3D models NL266/NR266).
;   2. The P3 model pack (MTO_P3_ModelsVol01) providing those S3D meshes.
; Uncomment to route every FA-2 drag to the angled art under any style. A quarter-turn pairs
; XP with ZN and XN with ZP; if a heading renders 90 degrees off, swap the two instance IDs
; between the pairs (or set the invert-quarter-turn exemplar property on one of the props).
;[PowerPoles.FAR]
;FAR-2.XP=0xB07EFA20
;FAR-2.ZN=0xB07EFA20
;FAR-2.XN=0xB07EFA21
;FAR-2.ZP=0xB07EFA21
