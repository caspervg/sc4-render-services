[SC4PowerPoleCustomization]
; Lets power-pole prop exemplars declare custom cable attachment geometry and wire appearance.
; Properties are documented in docs/power-pole-customization.md. Props that define none of those
; properties remain on the unmodified vanilla rendering path.
Enabled=true

; Upper bound on attachment points and per-wire overrides accepted from one property.
; Vanilla has four wires; raise this to allow denser bundles. Valid range: 1-15.
MaxPointsPerDirection=8

; Optional named pole styles. Same key format as vanilla's own [PowerPoles] Network INI section:
; 0x00-0x0f is a 4-bit connection-direction bitmask, value is a pole prop exemplar Instance ID
; (Type 0x6534284A, Group matching vanilla's power-pole group unless your poles use a different one).
; A section can be sparse -- masks it doesn't define fall back to the vanilla instance for that mask.
;
; A style may also set InterPoleDistance = the max number of cells between poles while that style is
; active (vanilla is 10; range 1-50). Larger = poles farther apart / fewer poles. It applies only
; while the style is active and is restored to vanilla otherwise. A style may set only
; InterPoleDistance (no 0x00-0x0f keys) to change spacing without changing pole models.
;
; Switching which style is active is INTERIM/TEST-ONLY right now: use the "polestyle" cheat code to
; cycle through vanilla + every style below (applies to newly-placed poles only, not existing ones).
; A real Tab/Shift-Tab in-tool switch is planned but not yet implemented.
;
;[PowerPoles.Steel]
;0x00=0x05000205
;0x05=0x05000105
;InterPoleDistance=14
;...
;
;[PowerPoles.Wood]
;0x00=0x06000205
;0x05=0x06000105
;InterPoleDistance=7
;...
