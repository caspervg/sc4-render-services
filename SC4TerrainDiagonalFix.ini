[SC4TerrainDiagonalFix]
; Experimental fix for terrain near-cliff diagonal jagged edges.
; The DLL does not mark cells as cliffs and does not assign cliff textures.
Enabled=true

; Clear the DLL's internal flip bit again when a cell no longer meets MinHeightDelta.
ClearNonCandidates=true

; Make terrain height queries follow the same flipped diagonal used by rendering.
; This is intended to align prop placement with the corrected terrain surface.
MatchHeightQueriesToFlippedCells=true

; Minimum height range among the four corners before the DLL considers a cell.
; Increase this if too much ordinary sloped terrain changes triangulation.
MinHeightDelta=12.0

; Difference margin between the two possible diagonal height deltas.
; Higher values reduce flip churn on almost-tied cells.
DiagonalHysteresis=0.05

; Set to 0 to log every pass with changes. Larger values reduce log volume.
LogEveryNChanges=2048
